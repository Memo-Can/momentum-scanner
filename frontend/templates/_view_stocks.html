<div id="view-stocks">
<table>
  <thead>
    <tr id="head-row">
      <th class="left" data-key="_default" data-type="default" data-tip="Sıralamadaki yeri: önce Skor gücü (GÜÇLÜ AL en üstte, GÜÇLÜ SAT en altta), aynı skor grubu içinde günlük % değişime göre büyükten küçüğe.">#<span class="arrow"></span></th>
      <th class="left" data-key="ticker" data-type="text" data-tip="Hisse sembolü (ticker).">Hisse<span class="arrow"></span></th>
      {% if logged_in %}
      <th class="left" data-key="ticker_flag" data-type="text" data-tip="Kendi işaretin (Güvenilir/Sorunlu) ve isteğe bağlı bir not - sadece sen görürsün. 'Sorunlu' işaretli bir hisse otomatik alım-satımda (Sanal Al-Sat) hariç tutulur.">İşaret<span class="arrow"></span></th>
      {% endif %}
      <th class="left" data-key="_index" data-type="index" data-tip="Resmi BIST30/BIST100 endeks üyeliği - BIST30, BIST100'ün bir alt kümesidir (BIST30'da olan bir hisse otomatik olarak BIST100'de de vardır).">Endeks<span class="arrow"></span></th>
      <th class="left" data-key="sector" data-type="text" data-tip="Hissenin kısa sektör kodu - Yahoo Finance'in canlı 'sector' alanından türetilir.">Sektör<span class="arrow"></span></th>
      {% if logged_in %}
      <th data-key="score" data-type="score" data-tip="1d, MACD, RSI, BB% ve RS sinyallerinin tek bir konfluens puanında (-5..+5) birleştirilmiş hali: GÜÇLÜ AL(▲▲)/AL(▲)/NÖTR(–)/SAT(▼)/GÜÇLÜ SAT(▼▼). ADX(14), GÜÇLÜ AL/SAT etiketini teyit eden bir güven filtresidir - ADX<20 ise 'güçlü' etiket normal AL/SAT'a düşer.">Skor<span class="arrow"></span></th>
      <th class="left" data-key="score_since" data-type="text" data-tip="Güncel Skor değerine en son ne zaman geçildi - skor değişmediği sürece bu zaman sabit kalır. Hücredeki yazı göreceli ('3 gün önce'), tam tarih/saati görmek için hücrenin üzerine gelebilirsin.">Sinyal Zamanı<span class="arrow"></span></th>
      {% endif %}
      <th data-key="signal_1d" data-type="signal" data-tip="Günlük mumda EMA9/EMA21'e göre sürekli trend yönü (AL/SAT/NÖTR).">1d<span class="arrow"></span></th>
      {% if logged_in %}
      <th data-key="signal_macd" data-type="signal" data-tip="MACD histogramına (12,26,9) göre sürekli AL/SAT/NÖTR - histogram farkı > 0 ise AL. EMA sinyaline ek momentum teyidi.">MACD<span class="arrow"></span></th>
      {% endif %}
      <th data-key="price" data-type="num" data-tip="Canlı fiyat (Yahoo Finance'in regularMarketPrice alanı).">Fiyat<span class="arrow"></span></th>
      {% if logged_in %}
      <th data-key="volume_ratio" data-type="num" data-tip="Bugünkü işlem hacminin, 10 günlük ortalama hacme oranı (örn. 2.3x). Yüksek oran, fiyat hareketinin gerçek katılımla desteklendiğini gösterir.">Hacim<span class="arrow"></span></th>
      <th data-key="day_range_pos" data-type="num" data-tip="Fiyatın, günün dip-zirve aralığındaki yeri (%). %100 = günün zirvesi (alıcı baskın), %0 = günün dibi (satıcı baskın).">GünPoz<span class="arrow"></span></th>
      <th data-key="rsi" data-type="num" data-tip="Wilder RSI(14) değeri (0-100). >=70 aşırı alım, <=30 aşırı satım sayılır; momentum taramasında 50 üzeri boğa teyidi.">RSI<span class="arrow"></span></th>
      <th data-key="bb_percent" data-type="num" data-tip="Bollinger Bantları (20, 2 sigma) içindeki konum (%). 100% = üst bant, 0% = alt bant. Bandın dışına çıkan değer (>100%/<0%), hacimle birlikteyse güçlü kırılım sayılabilir.">BB%<span class="arrow"></span></th>
      <th data-key="rel_strength" data-type="num" data-tip="Göreceli güç: hissenin günlük % değişimi eksi BIST100 endeksinin (XU100) günlük % değişimi. |RS| < 0.5 NÖTR sayılır.">RS<span class="arrow"></span></th>
      <th data-key="day_stop" data-type="num" data-tip="ATR(14)x1.5 mesafeli, Skor'un yönüne (AL/SAT) göre gün içi (day trade) stop-loss fiyatı. Skor NÖTR ise gösterilmez.">GünStop<span class="arrow"></span></th>
      <th data-key="day_target" data-type="num" data-tip="Gün içi hedef fiyat - stop mesafesinin 3 katı uzaklıkta (risk:ödül ~1:3).">GünHedef<span class="arrow"></span></th>
      <th data-key="swing_stop" data-type="num" data-tip="ATR(14)x3.0 mesafeli, birkaç gün/hafta taşınacak swing pozisyonlar için stop-loss fiyatı. Sanal Al-Sat'ın otomatik alımlarının stop/hedefi de budur.">SwStop<span class="arrow"></span></th>
      <th data-key="swing_target" data-type="num" data-tip="Swing pozisyon için hedef fiyat - stop mesafesinin 3 katı uzaklıkta (risk:ödül ~1:3).">SwHedef<span class="arrow"></span></th>
      {% endif %}
      <th data-key="daily" data-type="num" data-tip="Canlı fiyat ile Yahoo'nun canlı 'önceki kapanış' alanı arasındaki yüzde fark. Liste varsayılan olarak (Skor grubu içinde) bu sütuna göre büyükten küçüğe sıralanır.">Günlük<span class="arrow"></span></th>
      <th data-key="d5" data-type="num" data-tip="Son 5 işlem günündeki yüzde değişim - kayan pencere (takvim haftası değil), Yahoo'nun web sitesindeki '5D' ile aynı mantık.">5D<span class="arrow"></span></th>
      <th data-key="m1" data-type="num" data-tip="Son 21 işlem günündeki (~1 aylık) yüzde değişim - kayan pencere (takvim ayı değil), Yahoo'nun web sitesindeki '1M' ile aynı mantık.">1M<span class="arrow"></span></th>
      <th data-key="y1" data-type="num" data-tip="Son 250 işlem günündeki (~1 yıllık) yüzde değişim - kayan pencere (takvim yılı değil), Yahoo'nun web sitesindeki '1Y' ile aynı mantık.">1Y<span class="arrow"></span></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div id="pager">
  <div id="pager-page-indicator"></div>
  <div id="pager-controls">
    <button class="market-tab-btn active" data-size="30" type="button">30</button>
    <button class="market-tab-btn" data-size="50" type="button">50</button>
    <button class="market-tab-btn" data-size="100" type="button">100</button>
    <button class="market-tab-btn" data-size="max" type="button">Tümü</button>
    <button class="market-tab-btn" id="pager-prev" type="button">&lsaquo; Önceki</button>
    <button class="market-tab-btn" id="pager-next" type="button">Sonraki &rsaquo;</button>
  </div>
</div>
</div>

<script>
// HISSE TABLOSU GORUNUMUNE OZEL JS - sadece bu goruntunun tablosunu ve
// siralama/arama mantigini kapsar. index.html'deki core script'ten
// (escapeHtml/fmtPct/selectTicker/showView/SCORE_SYMBOLS vb.) SONRA calisir -
// core script index.html'in EN ALTINDA (bu include'dan SONRA) oldugu icin,
// en alttaki bootstrap cagrisi (asagida) DOMContentLoaded'a kadar beklenir
// (core'un fonksiyonlari o ana kadar kesin tanimlanmis olur).
//
// 2026-11-03'te BIST 30/100/300 sekme butonlari (ve onlari filtreleyen
// applyMarketFilter()/activeMarket) TAMAMEN KALDIRILDI - kullanici isteği:
// tek bir tabloda HER ZAMAN tum hisseler gosterilsin, hangi endekse ait
// olduklari ayri bir "Endeks" sutununda (bkz. asagidaki renderRows()) belli
// olsun. Backend zaten her satiri bist30/bist100 bayraklariyla etiketliyor
// (bkz. bist_scanner.py), bu bayraklar o zaman FILTRELEME icin degil
// SADECE goruntuleme icin kullaniliyordu.
//
// 2026-11-18'de "#index-filter-select" (index.html'deki #market-tabs'ta,
// arama kutusunun HEMEN SOLUNDA bir dropdown - kullanici istegi) ile
// FILTRELEME GERI eklendi - AMA o zamanki kaldirma kararini bozmuyor:
// o zamanki sorun hangi hissenin hangi endekste oldugunun sekme ARKASINDA
// GIZLI olmasiydi, Endeks sutunu (seffaflik) HALA duruyor/kaldirilmadi. Bu
// YENI filtre kullanicinin KENDI tercihiyle (localStorage'da kalici) GORUNEN
// alt kumeyi secmesine yariyor - "gizli mantik" geri gelmedi, SADECE
// "goster + istege bagli daralt" ikisi birlikte var. Dropdown HTML'i
// index.html'de (arama kutusuyla AYNI #market-tabs konteyneri icinde,
// "solunda" yerlesim icin) - event listener'i ise (search-input/search-clear
// ile AYNI desen) burada, bu dosyanin script'inde.

// Sembolik sutunlarin sayisal karsiligi - sirala derken "en guclu" once/sonra
// gelsin diye. Skor icin cift ok, sinyal icin tek ok daha "guclu" sayilir.
const SCORE_RANK = {MUTLAK_AL: 3, GUCLU_AL: 2, AL: 1, NOTR: 0, SAT: -1, GUCLU_SAT: -2, MUTLAK_SAT: -3};
const SIGNAL_RANK = {AL: 1, NOTR: 0, SAT: -1};

let latestRows = [];
// key=null -> varsayilan siralama (Skor gucu, sonra gunluk %).
// Bir basliga tiklaninca o sutuna gore siralamaya gecilir.
let sortState = { key: null, dir: 'desc' };
let searchQuery = '';
let lastUpdatedAt = null;
let lastMissingCount = 0;
// Sayfalama (2026-11-03'te eklendi, varsayilan 25 -> 30'a 2026-11-12'de
// kullanici istegiyle degistirildi) - 'max' tum satirlari (hic kesmeden)
// gosterir, sayisal degerler (30/50/100) sayfa basina gosterilecek satir
// sayisidir. Arama/siralama DEGISTIGINDE 1. sayfaya donulur (asagidaki
// ilgili event listener'larda currentPage = 1 satirlarina bak).
let pageSize = 30;
let currentPage = 1;

// Endeks filtresi (2026-11-18'de eklendi, kullanici istegi: "listeye filtre
// ayari ekleyelim... secili olan ayar kayitli kalsin") - localStorage'da
// KALICI (per-viewer, chartRange/paperEquityRange ile AYNI desen), 2026-11-03'te
// kaldirilan BIST30/100/300 SEKMELERINDEN kasitli olarak FARKLI bir sey:
// o zamanki sorun hangi hissenin hangi endekste oldugunun sekme arkasinda
// GIZLI olmasiydi (Endeks sutunu yoktu) - artik Endeks sutunu HER ZAMAN
// gorunur/seffaf, bu filtre SADECE kullanicinin gormek istedigi alt kumeyi
// SECMESINE yariyor, eski "gizli mantik" sorunu geri gelmiyor.
let indexFilter = localStorage.getItem('stockIndexFilter') || 'ALL';

function applyIndexFilter(rows) {
  if (indexFilter === 'BIST30') return rows.filter(r => r.bist30);
  if (indexFilter === 'BIST100') return rows.filter(r => r.bist100);
  return rows;
}

// Endeks sutununda GORUNEN kisa etiket - '30' (BIST30) / '100' (BIST100,
// BIST30 HARIC) / '-' (hicbiri). BIST30, BIST100'un alt kumesi oldugu icin
// bir BIST30 hissesi SADECE '30' gosterir ('100' tekrar yazilmaz).
function indexDisplayLabel(r) {
  return r.bist30 ? '30' : (r.bist100 ? '100' : '-');
}

// Arama metni GORUNEN etiketten FARKLI: BIST30 bir hisse AYNI ZAMANDA
// BIST100'un de uyesi oldugu icin (dogrulanmis alt kume iliskisi, bkz.
// CLAUDE.md), "100" aratildiginda BIST30 hisseleri de sonuca girsin diye
// '30 100' dondurur - GORUNEN hucrede bu ikisi tekrar yazilmiyor ama arama
// ikisini de kapsamali.
function indexSearchText(r) {
  return r.bist30 ? '30 100' : (r.bist100 ? '100' : '');
}

// Arama kutusu: hisse sembolu, sektor kodu VEYA BIST30/100 endeks
// uyeligine gore anlik filtreler (2026-11-03'te endeks de eklendi -
// buyuk/kucuk harf duyarsiz, "icerir" eslesmesi).
function applySearch(rows) {
  if (!searchQuery) return rows;
  const q = searchQuery.toLowerCase();
  return rows.filter(r =>
    (r.ticker || '').toLowerCase().includes(q) ||
    (r.sector || '').toLowerCase().includes(q) ||
    indexSearchText(r).includes(q)
  );
}

function renderRows(rows) {
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    if (r.ticker === selectedTicker) tr.classList.add('selected');
    tr.onclick = () => selectTicker(r.ticker);
    tr.innerHTML = `
      <td class="left">${i + 1}</td>
      <td class="left">${escapeHtml(r.ticker)}</td>
      ${LOGGED_IN ? `<td class="left flag-cell" title="İşaretle / not ekle">${tickerFlagBadgeHtml(r.ticker_flag)}</td>` : ''}
      <td class="left">${indexDisplayLabel(r)}</td>
      <td class="left">${escapeHtml(r.sector || '-')}</td>
      ${LOGGED_IN ? `<td class="sym-${r.score} score-cell" title="Günlük Skor Geçmişi'ni büyütülmüş görüntüde aç">${SCORE_SYMBOLS[r.score] || r.score}</td><td class="left" title="${escapeHtml(fmtScoreSince(r.score_since))}">${fmtRelativeTime(r.score_since)}</td>` : ''}
      <td class="sym-${r.signal_1d}">${SIGNAL_SYMBOLS[r.signal_1d] || r.signal_1d}</td>
      ${LOGGED_IN ? `<td class="sym-${r.signal_macd}">${SIGNAL_SYMBOLS[r.signal_macd] || r.signal_macd}</td>` : ''}
      <td>${fmtPrice(r.price)}</td>
      ${LOGGED_IN ? `
      <td>${fmtRatio(r.volume_ratio)}</td>
      <td>${fmtRangePos(r.day_range_pos)}</td>
      <td>${fmtRsi(r.rsi)}</td>
      <td>${fmtRangePos(r.bb_percent)}</td>
      <td>${fmtPct(r.rel_strength)}</td>
      <td class="${r.day_stop === null || r.day_stop === undefined ? 'dash' : ''}">${fmtPrice(r.day_stop)}</td>
      <td class="${r.day_target === null || r.day_target === undefined ? 'dash' : ''}">${fmtPrice(r.day_target)}</td>
      <td class="${r.swing_stop === null || r.swing_stop === undefined ? 'dash' : ''}">${fmtPrice(r.swing_stop)}</td>
      <td class="${r.swing_target === null || r.swing_target === undefined ? 'dash' : ''}">${fmtPrice(r.swing_target)}</td>
      ` : ''}
      <td class="${pctClass(r.daily)}">${fmtPct(r.daily)}</td>
      <td class="${pctClass(r.d5)}">${fmtPct(r.d5)}</td>
      <td class="${pctClass(r.m1)}">${fmtPct(r.m1)}</td>
      <td class="${pctClass(r.y1)}">${fmtPct(r.y1)}</td>
    `;
    // Skor hucresi tiklanabilir (2026-11-06'da eklendi, kullanici istegi:
    // "skorlar tiklanabilir olsun, tiklandiginda gunluk alim satim listesi
    // bir popup'ta gorunsun") - inline onclick="" STRING'i YERINE DOM
    // property atamasi kullanilir (tr.onclick = () => selectTicker(r.ticker)
    // ile AYNI desen) cunku r.ticker Yahoo'nun dinamik tarama sonuclarindan
    // geliyor (bizim kontrolumuzde degil) - bir HTML string'ine inline
    // gomulseydi (onclick="...${r.ticker}...") tirnak/HTML enjeksiyonuna
    // acik olurdu, DOM property atamasi bu riski tasimaz. stopPropagation()
    // satirin kendi tiklamasinin (selectTicker) AYRICA tetiklenmesini onler -
    // openScoreHistoryPopup() zaten kendi icinde gerekirse selectTicker'i
    // cagiriyor (bkz. _view_graphic.html).
    const scoreCell = tr.querySelector('.score-cell');
    if (scoreCell) {
      scoreCell.onclick = (e) => {
        e.stopPropagation();
        openScoreHistoryPopup(r.ticker);
      };
    }
    // Isaret hucresi (2026-11-09'da eklendi, kullanici istegi: "manuel
    // takibe alinanlara da skor koy" sonrasi "listede sikintili ya da
    // guvenilir olan hisseleri bilmem gerekiyor") - score-cell ile AYNI
    // DOM-property atama + stopPropagation deseni (satirin kendi tiklamasi
    // - selectTicker - AYRICA tetiklenmesin diye).
    const flagCell = tr.querySelector('.flag-cell');
    if (flagCell) {
      flagCell.onclick = (e) => {
        e.stopPropagation();
        openTickerFlagPanel(r.ticker, r.ticker_flag, r.ticker_note);
      };
    }
    tbody.appendChild(tr);
  });
}

function sortValue(row, key, type) {
  if (type === 'index') return row.bist30 ? 2 : (row.bist100 ? 1 : 0);
  if (type === 'score') return SCORE_RANK[row[key]] ?? 0;
  if (type === 'signal') return SIGNAL_RANK[row[key]] ?? 0;
  if (type === 'text') return (row[key] || '').toString();
  return row[key];  // num: null'lar asagida ayri ele alinir
}

// backend'deki scanner.SCORE_ORDER ile BIREBIR AYNI tutulmali (bkz. CLAUDE.md).
const DEFAULT_SCORE_ORDER = {MUTLAK_AL: 0, GUCLU_AL: 1, AL: 2, NOTR: 3, SAT: 4, GUCLU_SAT: 5, MUTLAK_SAT: 6};

function applySort(rows) {
  const sorted = rows.slice();
  if (sortState.key === null) {
    // Varsayilan: once Skor gucu (GUCLU AL en ustte), sonra gunluk % (buyukten kucuge)
    sorted.sort((a, b) => {
      const byScore = (DEFAULT_SCORE_ORDER[a.score] ?? 3) - (DEFAULT_SCORE_ORDER[b.score] ?? 3);
      if (byScore !== 0) return byScore;
      const ad = a.daily === null || a.daily === undefined ? -Infinity : a.daily;
      const bd = b.daily === null || b.daily === undefined ? -Infinity : b.daily;
      return bd - ad;
    });
    return sorted;
  }

  const th = document.querySelector(`th[data-key="${sortState.key}"]`);
  const type = th ? th.dataset.type : 'num';
  const dirMult = sortState.dir === 'asc' ? 1 : -1;

  sorted.sort((a, b) => {
    let va = sortValue(a, sortState.key, type);
    let vb = sortValue(b, sortState.key, type);
    if (type === 'text') return dirMult * va.localeCompare(vb);
    // null/undefined degerler siralama yonunden bagimsiz her zaman en sona
    const aNull = va === null || va === undefined;
    const bNull = vb === null || vb === undefined;
    if (aNull && bNull) return 0;
    if (aNull) return 1;
    if (bNull) return -1;
    return dirMult * (va - vb);
  });
  return sorted;
}

function updateHeaderIndicators() {
  document.querySelectorAll('#head-row th').forEach(th => {
    const arrow = th.querySelector('.arrow');
    const isActive = th.dataset.key === (sortState.key === null ? '_default' : sortState.key);
    th.classList.toggle('sorted', isActive);
    if (!arrow) return;
    arrow.textContent = isActive ? (sortState.dir === 'asc' ? '▲' : '▼') : '';
  });
}

// Sayfalanacak diziyi (zaten arama+siralama uygulanmis) pageSize/currentPage'e
// gore kesip pager kontrollerinin (sayfa gostergesi, onceki/sonraki
// butonlarinin disabled durumu) gorunumunu gunceller. currentPage, toplam
// sayfa sayisini ASAN bir degerdeyse (orn. arama sonucu kuculduyse) en son
// sayfaya SIKISTIRILIR.
function paginate(rows) {
  if (pageSize === 'max') {
    document.getElementById('pager-page-indicator').textContent = `${rows.length} hisse (tümü)`;
    document.getElementById('pager-prev').disabled = true;
    document.getElementById('pager-next').disabled = true;
    return rows;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * pageSize;
  document.getElementById('pager-page-indicator').textContent = `Sayfa ${currentPage}/${totalPages}`;
  document.getElementById('pager-prev').disabled = currentPage <= 1;
  document.getElementById('pager-next').disabled = currentPage >= totalPages;
  return rows.slice(start, start + pageSize);
}

function renderTable() {
  const filtered = applySearch(applyIndexFilter(latestRows));
  const sorted = applySort(filtered);
  renderRows(paginate(sorted));
  updateHeaderIndicators();

  const countText = (searchQuery || indexFilter !== 'ALL')
    ? `${filtered.length}/${latestRows.length} hisse (filtrelendi)`
    : `${latestRows.length} hisse`;
  document.getElementById('meta').textContent =
    `${countText} | güncelleme: ${lastUpdatedAt || '-'} | her ${REFRESH_SECONDS} sn'de yenilenir`;
  document.getElementById('warning').textContent =
    lastMissingCount ? `Uyarı: ${lastMissingCount} hisse için veri alınamadı, hedeflenen sayıya ulaşılamadı.` : '';
}

// localStorage'dan okunan indexFilter, dropdown'un HTML'deki varsayilan
// secili secenegi (Hepsi) ile FARKLI olabilir (kullanici onceki ziyarette
// baska bir filtre secmisse) - sayfa ilk acilirken dropdown'u dogru degere
// getirmek icin bu senkronizasyon GEREKLI.
const indexFilterSelect = document.getElementById('index-filter-select');
if (indexFilterSelect) {
  indexFilterSelect.value = indexFilter;
  indexFilterSelect.addEventListener('change', () => {
    indexFilter = indexFilterSelect.value;
    localStorage.setItem('stockIndexFilter', indexFilter);
    currentPage = 1;
    renderTable();
  });
}

document.querySelectorAll('#pager-controls [data-size]').forEach(btn => {
  btn.addEventListener('click', () => {
    const size = btn.dataset.size;
    pageSize = size === 'max' ? 'max' : parseInt(size, 10);
    currentPage = 1;
    document.querySelectorAll('#pager-controls [data-size]').forEach(b => b.classList.toggle('active', b === btn));
    renderTable();
  });
});
document.getElementById('pager-prev').addEventListener('click', () => {
  currentPage -= 1;
  renderTable();
});
document.getElementById('pager-next').addEventListener('click', () => {
  currentPage += 1;
  renderTable();
});

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value.toUpperCase().trim();
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  currentPage = 1;
  renderTable();
});
document.getElementById('search-clear').addEventListener('click', () => {
  const input = document.getElementById('search-input');
  input.value = '';
  searchQuery = '';
  document.getElementById('search-clear').style.display = 'none';
  currentPage = 1;
  renderTable();
  input.focus();
});

document.querySelectorAll('#head-row th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    currentPage = 1;
    if (key === '_default') {
      sortState = { key: null, dir: 'desc' };
    } else if (sortState.key === key) {
      sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
    } else {
      // Metin sutunu varsayilan A->Z, sayisal/sembolik sutun varsayilan buyukten kucuge
      sortState = { key, dir: th.dataset.type === 'text' ? 'asc' : 'desc' };
    }
    renderTable();
  });
});

async function refreshRows() {
  try {
    const res = await fetch('/api/rows');
    const data = await res.json();
    latestRows = data.rows || [];
    lastUpdatedAt = data.updated_at || null;
    lastMissingCount = data.missing_count || 0;
    renderTable();
  } catch (e) {
    document.getElementById('meta').textContent = 'Veri alınamadı, tekrar denenecek...';
  }
}

// Sayfa acilirken URL'de bir hisse varsa (orn. #thyao, selectTicker'in
// kendisinin ekledigi) tablo ilk kez dolduktan sonra o hisse otomatik
// secilir - boylece bir hissenin linki paylasilinca dogrudan o grafikle acilir.
// DOMContentLoaded'a kadar beklenir - index.html'in en altindaki core
// script'i (selectTicker tanimi) bu noktada KESIN calismis olur (script tag
// sirasina BAGIMLI olmadan).
document.addEventListener('DOMContentLoaded', () => {
  refreshRows().then(() => {
    const hashTicker = location.hash.slice(1);
    if (hashTicker) selectTicker(hashTicker.toUpperCase());
  });
  setInterval(refreshRows, REFRESH_SECONDS * 1000);
});
</script>

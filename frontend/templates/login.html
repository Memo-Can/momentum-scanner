<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş Yap - Momentum Scanner</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="login-wrap">
  <form id="login-box" method="post">
    <h1>Giriş Yap</h1>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <label for="login-username">Kullanıcı adı</label>
    <input type="text" id="login-username" name="username" autocomplete="username" required autofocus>
    <label for="login-password">Şifre</label>
    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
    <button type="submit">Giriş Yap</button>
  </form>
</div>
</body>
</html>
